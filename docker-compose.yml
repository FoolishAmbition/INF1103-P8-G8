
services:

  gui:
    build: .
    container_name: eventwise-gui
    command: python main.py

    env_file:
      - .env

    environment:
      MONGODB_URI: mongodb://mongodb:27017/

    ports:
      - "127.0.0.1:5000:5000"

    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8.0
    container_name: eventwise-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      

  eventwise:
    build: .
    container_name: eventwise-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
