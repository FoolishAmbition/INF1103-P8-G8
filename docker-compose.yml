
services:
  mongodb:
    image: mongo:8.0
    container_name: eventwise-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  eventwise:
    build: .
    container_name: eventwise-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
